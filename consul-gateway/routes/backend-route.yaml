apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: backend-api-route
  namespace: default
  labels:
    app: backend-api
spec:
  # Reference to the Gateway
  parentRefs:
    - name: api-gateway
      namespace: consul
      sectionName: https-mtls
  
  # Hostnames this route responds to
  hostnames:
    - "api.example.com"
    - "*.api.example.com"
  
  # Routing rules
  rules:
    # Rule 1: API endpoints
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
          method: GET
        - path:
            type: PathPrefix
            value: /api/v1
          method: POST
      
      # Optional: Request header matching
      # matches:
      #   - headers:
      #       - name: X-API-Version
      #         value: "v1"
      
      # Backend service reference
      backendRefs:
        - name: backend-service
          port: 8080
          weight: 100
      
      # Optional: Filters for request/response modification
      filters:
        # Add custom headers
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Gateway
                value: consul-api-gateway
        
        # Optional: Response header modification
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
    
    # Rule 2: Health check endpoint
    - matches:
        - path:
            type: Exact
            value: /health
          method: GET
      
      backendRefs:
        - name: backend-service
          port: 8080
      
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Health-Check
                value: "true"
    
    # Rule 3: Metrics endpoint (restricted)
    - matches:
        - path:
            type: Exact
            value: /metrics
          method: GET
      
      backendRefs:
        - name: backend-service
          port: 8080
      
      # Optional: Add authentication requirement
      # This would require additional configuration
---
# HTTP to HTTPS redirect route
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: default
  labels:
    app: http-redirect
spec:
  parentRefs:
    - name: api-gateway
      namespace: consul
      sectionName: http-redirect
  
  hostnames:
    - "api.example.com"
    - "*.api.example.com"
  
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Example: Multiple backend services with traffic splitting
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: canary-deployment-route
  namespace: default
  labels:
    app: backend-api
    deployment: canary
spec:
  parentRefs:
    - name: api-gateway
      namespace: consul
  
  hostnames:
    - "api.example.com"
  
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      
      # Traffic splitting between stable and canary
      backendRefs:
        - name: backend-service-stable
          port: 8080
          weight: 90  # 90% to stable
        
        - name: backend-service-canary
          port: 8080
          weight: 10  # 10% to canary
---
# Example: Path-based routing to different services
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: multi-service-route
  namespace: default
  labels:
    app: multi-service
spec:
  parentRefs:
    - name: api-gateway
      namespace: consul
  
  hostnames:
    - "api.example.com"
  
  rules:
    # Route /api/users to user service
    - matches:
        - path:
            type: PathPrefix
            value: /api/users
      backendRefs:
        - name: user-service
          port: 8080
    
    # Route /api/orders to order service
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      backendRefs:
        - name: order-service
          port: 8080
    
    # Route /api/products to product service
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      backendRefs:
        - name: product-service
          port: 8080

