apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: api-gateway-to-backend
  namespace: default
  labels:
    app: backend-service
spec:
  # Destination service (backend)
  destination:
    name: backend-service
  
  # Sources that can access the destination
  sources:
    # Allow API Gateway to access backend
    - name: api-gateway
      namespace: consul
      action: allow
      
      # L7 permissions for fine-grained control
      permissions:
        # Allow GET requests to /api/v1/*
        - action: allow
          http:
            pathPrefix: /api/v1
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        
        # Allow health checks
        - action: allow
          http:
            pathExact: /health
            methods:
              - GET
        
        # Allow metrics endpoint (optional)
        - action: allow
          http:
            pathExact: /metrics
            methods:
              - GET
    
    # Deny all other sources by default
    - name: "*"
      action: deny
---
# Service Intentions for user service
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: api-gateway-to-user-service
  namespace: default
  labels:
    app: user-service
spec:
  destination:
    name: user-service
  
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
      permissions:
        - action: allow
          http:
            pathPrefix: /api/users
            methods:
              - GET
              - POST
              - PUT
              - DELETE
---
