# Example: Service-to-service intentions (backend to database)
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: backend-to-database
  namespace: default
  labels:
    app: database
spec:
  destination:
    name: database-service
  
  sources:
    # Allow backend service to access database
    - name: backend-service
      namespace: default
      action: allow
    
    # Allow user service to access database
    - name: user-service
      namespace: default
      action: allow
    
    # Deny all others
    - name: "*"
      action: deny
---
# Example: Deny intentions for sensitive services
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: admin-service-deny-all
  namespace: default
  labels:
    app: admin-service
spec:
  destination:
    name: admin-service
  
  sources:
    # Only allow specific admin gateway
    - name: admin-gateway
      namespace: consul
      action: allow
      permissions:
        - action: allow
          http:
            pathPrefix: /admin
            methods:
              - GET
              - POST
            headers:
              - name: X-Admin-Token
                present: true
    
    # Deny everything else
    - name: "*"
      action: deny
---
